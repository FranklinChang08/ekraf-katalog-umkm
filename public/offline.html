<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Wearhaus Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #1b2420;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid #dde5e0;
      background-color: #f1f5f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon {
      width: 56px;
      height: 56px;
      color: #5b6a62;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #1b2420;
    }
    p {
      font-size: 14px;
      color: #5b6a62;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1f6b4f;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #154d39;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
    </svg>
    <h1>Koneksi Terputus</h1>
    <p>Anda sedang berada dalam kondisi offline. Sambungkan kembali perangkat Anda ke internet untuk melihat katalog dan informasi produk terbaru.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
